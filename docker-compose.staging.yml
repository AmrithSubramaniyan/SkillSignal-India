version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillsignal-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillsignal}
      POSTGRES_USER: ${POSTGRES_USER:-skillsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - skillsignal_staging_pgdata:/var/lib/postgresql/data
    networks:
      - skillsignal_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-skillsignal} -d $${POSTGRES_DB:-skillsignal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: skillsignal-staging-kafka
    restart: unless-stopped
    mem_limit: 900m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    # Internal network only — never exposed to host
    volumes:
      - skillsignal_staging_kafkadata:/var/lib/kafka/data
    networks:
      - skillsignal_internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ./backend
    container_name: skillsignal-staging-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillsignal}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-skillsignal}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set in .env}
      APP_MAILBOX_ENCRYPTION_KEY: ${APP_MAILBOX_ENCRYPTION_KEY:?APP_MAILBOX_ENCRYPTION_KEY must be set in .env}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-mock}
      APP_SEED_DEMO: "false"
    ports:
      - "8080:8080"
    networks:
      - skillsignal_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: skillsignal-staging-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - skillsignal_internal

networks:
  skillsignal_internal:
    driver: bridge

volumes:
  skillsignal_staging_pgdata:
  skillsignal_staging_kafkadata:
