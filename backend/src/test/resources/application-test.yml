spring:
  datasource:
    url: jdbc:h2:mem:skillsignal_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:19092}
    admin:
      fail-fast: false
      auto-create: false
    consumer:
      group-id: skillsignal-session-summary
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      missing-topics-fatal: false
      auto-startup: false

app:
  uploads:
    dir: ./target/test-uploads
  ai:
    provider: mock
  session:
    idle-timeout-minutes: 15
    beacon-grace-seconds: 30
    checkout-grace-ms: 50
    max-summary-emails-per-day: 20
    max-email-rows: 50
    outbox-relay-interval-ms: 2000
    outbox-retention-days: 7
  seed-demo: false
