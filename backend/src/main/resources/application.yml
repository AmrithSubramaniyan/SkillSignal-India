server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: skillsignal-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/skillsignal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER,VALUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:skill}
    password: ${DB_PASSWORD:skillpass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      auto-create: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:skillsignal-session-summary}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      missing-topics-fatal: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-key-at-least-32-bytes-long-2026}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  auth:
    rate-limit-max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
    rate-limit-window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:claude-3-5-sonnet-latest}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  match:
    weights:
      required-skills: ${MATCH_WEIGHT_REQUIRED_SKILLS:60}
      nice-to-have-skills: ${MATCH_WEIGHT_NICE_TO_HAVE:10}
      experience: ${MATCH_WEIGHT_EXPERIENCE:20}
      location: ${MATCH_WEIGHT_LOCATION:10}
  session:
    idle-timeout-minutes: ${SESSION_IDLE_TIMEOUT_MINUTES:15}
    beacon-grace-seconds: ${SESSION_BEACON_GRACE_SECONDS:30}
    checkout-grace-ms: ${SESSION_CHECKOUT_GRACE_MS:30000}
    max-summary-emails-per-day: ${SESSION_MAX_SUMMARY_EMAILS_PER_DAY:20}
    max-email-rows: ${SESSION_MAX_EMAIL_ROWS:50}
    outbox-relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:3000}
    outbox-retention-days: ${OUTBOX_RETENTION_DAYS:7}
  seed-demo: ${APP_SEED_DEMO:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
